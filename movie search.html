<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <title>MovieSearch</title>
</head>

<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">MovieSearch</div>
      <nav class="nav">
        <a href="#">Home</a>
        <a href="#">Trending</a>
        <a href="#">New Releases</a>
      </nav>
    </header>

    <main class="hero">
      <div class="hero__content">
        <p class="eyebrow">Find your next favorite film</p>
        <h1>Search movies, discover stories, and stream the best picks.</h1>
        <div class="search-box">
          <input id="searchInput" type="text" placeholder="Search for a movie title..." aria-label="Search movies" />
          <button id="searchBtn">Search</button>
        </div>
      </div>
    </main>

    <section class="results-panel">
      <div class="results-header">
        <div>
          <h2>Popular movies</h2>
        </div>

        <div class="results-controls">
          <label for="sortFilter">Sort by:</label>
          <select id="sortFilter">
            <option value="az">A-Z</option>
            <option value="newToOld">New to Old</option>
            <option value="oldToNew">Old to New</option>
          </select>
          <span id="resultCount">0 results</span>
        </div>
      </div>
      <div id="movieResults" class="movie-grid"></div>
    </section>
  </div>

  <footer class="site-footer">
    <div class="footer-content">
      <p>© 2026 MovieSearch</p>
      <nav class="footer-nav">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="index.js"></script>
</body>

</html>
